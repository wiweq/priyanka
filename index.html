<!DOCTYPE html>
<html lang="en">
<head>
  </head>
  <link rel="icon" type="image/x-icon" href="02.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Priyanka Birthday</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#241536; --bg2:#3a1f52; --gold:#F5B942; --coral:#FF6B6B;
    --teal:#4ECDC4; --cream:#FFF8F0;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:radial-gradient(circle at 30% 20%, var(--bg2), var(--bg) 65%);
    color:var(--cream);
    font-family:'Nunito',sans-serif;
    min-height:100%;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; position:relative;
  }
  .floaters{position:fixed; inset:0; pointer-events:none; z-index:1;}
  .floaters img{
    position:absolute; bottom:-15%; width:90px; height:90px;
    object-fit:cover; border-radius:50%;
    border:3px solid var(--gold);
    box-shadow:0 8px 20px rgba(0,0,0,.35);
    animation:zigzag linear infinite;
    opacity:.95;
  }
  @keyframes zigzag{
    0%  {transform:translate(0,0);}
    12% {transform:translate(var(--dx),-14vh);}
    24% {transform:translate(0,-28vh);}
    36% {transform:translate(var(--dx),-42vh);}
    48% {transform:translate(0,-56vh);}
    60% {transform:translate(var(--dx),-70vh);}
    72% {transform:translate(0,-84vh);}
    84% {transform:translate(var(--dx),-98vh);}
    100%{transform:translate(0,-115vh);}
  }
  .card{
    position:relative; z-index:2; text-align:center; padding:2.5rem 2rem;
    max-width:480px; width:92%;
  }
  h1{
    font-family:'Baloo 2',cursive; font-weight:800;
    font-size:clamp(2.1rem, 8vw, 3.4rem);
    margin:0 0 .3rem; line-height:1.1;
    color:var(--gold);
    text-shadow:0 0 24px rgba(245,185,66,.35);
  }
  .sub{font-size:1.05rem; color:var(--cream); opacity:.85; margin-bottom:1.6rem;}
  .count{
    display:flex; gap:.8rem; justify-content:center; flex-wrap:wrap;
    margin-bottom:1.8rem;
  }
  .count div{
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15);
    border-radius:14px; padding:.9rem 1rem; min-width:72px;
  }
  .count .num{font-family:'Baloo 2',cursive; font-size:1.7rem; color:var(--teal); font-weight:800;}
  .count .lbl{font-size:.7rem; letter-spacing:.03em; opacity:.75;}
  button{
    font-family:'Baloo 2',cursive; font-weight:600; font-size:1.05rem;
    background:var(--coral); color:var(--cream); border:none;
    padding:.85rem 1.8rem; border-radius:999px; cursor:pointer;
    box-shadow:0 8px 20px rgba(255,107,107,.35);
  }
  button:active{transform:scale(.97);}
  button:focus-visible{outline:3px solid var(--teal); outline-offset:3px;}
  @media (prefers-reduced-motion: reduce){
    .floaters span{animation:none; opacity:.5;}
  }
</style>
</head>
<body>

<div class="floaters" id="floaters"></div>

<div class="card">
  <div id="content"></div>
</div>

<script>
  const NAME = "Priyanka";
  const BIRTHDATE = "09-20";
  const photos = ["00.jpeg","01.jpeg","02.jpeg"];
  const floaters = document.getElementById('floaters');
  photos.forEach((src,i)=>{
    const img = document.createElement('img');
    img.src = src;
    img.alt = "";
    img.style.left = (15 + i*30 + Math.random()*10) + "%";
    img.style.setProperty('--dx', (Math.random()*120+60)*(i%2?-1:1)+"px");
    img.style.animationDuration = (9 + i*2) + "s";
    img.style.animationDelay = (i*1.5) + "s";
    floaters.appendChild(img);
  });

  setInterval(sing, 10000);

  function isBirthdayToday(){
    const now = new Date();
    const [m,d] = BIRTHDATE.split("-").map(Number);
    return now.getMonth()+1 === m && now.getDate() === d;
  }

  function nextBirthday(){
    const now = new Date();
    const [m,d] = BIRTHDATE.split("-").map(Number);
    let next = new Date(now.getFullYear(), m-1, d, 0,0,0);
    if(next <= now) next = new Date(now.getFullYear()+1, m-1, d, 0,0,0);
    return next;
  }

  const content = document.getElementById('content');

  function sing(){
    if(!('speechSynthesis' in window)) return;
    const lines = [
      "Happy birthday to you,",
      "happy birthday to you,",
      `happy birthday dear ${NAME},`,
      "happy birthday to you!"
    ];
    window.speechSynthesis.cancel();
    lines.forEach((line, i)=>{
      const u = new SpeechSynthesisUtterance(line);
      u.pitch = 1.3; u.rate = 0.85;
      setTimeout(()=>window.speechSynthesis.speak(u), i*1400);
    });
  }

  function renderBirthday(){
    content.innerHTML = `
      <h1>Happy Birthday,<br>${NAME}!</h1>
      <p class="sub">Wishing you a wonderful day 🎉</p>
      
    `;
  }

  function renderCountdown(){
    content.innerHTML = `
      <h1 style="font-size:clamp(1.6rem,6vw,2.4rem)">Counting down to<br>${NAME}'s birthday</h1>
      <div class="count" id="countBox"></div>
      <p class="sub">Come back on the big day 🎂</p>
    `;
    const box = document.getElementById('countBox');
    function tick(){
      const diff = nextBirthday() - new Date();
      const d = Math.floor(diff/86400000);
      const h = Math.floor(diff/3600000)%24;
      const m = Math.floor(diff/60000)%60;
      const s = Math.floor(diff/1000)%60;
      box.innerHTML = [
        [d,"days"],[h,"hrs"],[m,"min"],[s,"sec"]
      ].map(([v,l])=>`<div><div class="num">${v}</div><div class="lbl">${l}</div></div>`).join("");
    }
    tick();
    setInterval(tick, 1000);
  }

  isBirthdayToday() ? renderBirthday() : renderCountdown();
</script>
</body>
</html>
